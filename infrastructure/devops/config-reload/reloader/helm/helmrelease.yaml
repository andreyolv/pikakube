apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: reloader
    namespace: reloader
  values:
  # https://artifacthub.io/packages/helm/stakater/reloader
  # https://github.com/stakater/Reloader/blob/master/deployments/kubernetes/chart/reloader/values.yaml
    reloader:
      reloadOnCreate: true
      serviceMonitor:
        enabled: true
