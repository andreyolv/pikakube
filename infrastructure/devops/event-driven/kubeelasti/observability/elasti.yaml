apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: elasti
  namespace: kubeelasti
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: kubeelasti
  datasources:
  - inputName: DS_PROMETHEUS
    datasourceName: Prometheus
  url: https://raw.githubusercontent.com/KubeElasti/KubeElasti/refs/heads/main/playground/infra/elasti-dashboard.yaml
# https://github.com/KubeElasti/KubeElasti/blob/main/playground/infra/elasti-dashboard.yaml
