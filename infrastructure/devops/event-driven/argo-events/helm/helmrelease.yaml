apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-events
  namespace: argo-events
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: argo-events
    namespace: argo-events
  values:
  # https://artifacthub.io/packages/helm/argo/argo-events
  # https://github.com/argoproj/argo-helm/blob/main/charts/argo-events/values.yaml
    crds:
      keep: false
