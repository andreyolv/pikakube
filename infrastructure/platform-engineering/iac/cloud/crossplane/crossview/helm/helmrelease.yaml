apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossview
  namespace: crossview
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: crossview
    namespace: crossview
  values:
  # https://artifacthub.io/packages/helm/crossview/crossview
  # https://github.com/crossplane-contrib/crossview/blob/main/helm/crossview/values.yaml
    # The chart creates its own Secret from any non-empty string below. Both are
    # required for the app to start; fill them in before applying, or swap each
    # one for a secretKeyRef pointing at a Secret managed outside Git.
    secrets:
      adminUsername: admin
      adminPassword: ""
      dbPassword: ""
      sessionSecret: ""
    # Bundled PostgreSQL. Disable it and set config.database.host to point at an
    # external instance — the chart image is postgres:latest, which is not a tag
    # to run unpinned for anything that matters.
    database:
      enabled: true
    ingress:
      enabled: false
