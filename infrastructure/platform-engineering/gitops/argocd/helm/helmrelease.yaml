apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: argo-cd
    namespace: argocd
  values:
  # https://artifacthub.io/packages/helm/argo/argo-cd
  # https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
    crds:
      keep: false
