apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lakekeeper
  namespace: lakekeeper
spec:
  interval: 5m
  chart:
    spec:
      chart: lakekeeper
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: lakekeeper
        namespace: flux-system
  values:
  # https://artifacthub.io/packages/helm/lakekeeper/lakekeeper
  # https://github.com/lakekeeper/lakekeeper-charts/blob/main/charts/lakekeeper/values.yaml
    catalog:
      prometheus:
        setScrapeAnnotations: true
    postgresql:
      enabled: false
    externalDatabase:
      host_read: "postgres-rw.lakekeeper.svc.cluster.local"
      host_write: "postgres-rw.lakekeeper.svc.cluster.local"
      port: 5432
      database: lakekeeper
      user: lakekeeper
      userSecret: postgres-app
      userSecretKey: "user"
      passwordSecret: postgres-app
      passwordSecretKey: "password"
