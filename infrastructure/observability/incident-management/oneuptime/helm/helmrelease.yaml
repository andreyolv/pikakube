apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oneuptime
  namespace: oneuptime
spec:
  interval: 5m
  chart:
    spec:
      chart: oneuptime
      version: 11.7.1
      sourceRef:
        kind: HelmRepository
        name: oneuptime
        namespace: flux-system
  values:
  # https://artifacthub.io/packages/helm/oneuptime/oneuptime
  # https://github.com/OneUptime/helm-chart/blob/master/oneuptime/values.yaml
    nginx:
      enabled: false
    postgresql:
      enabled: false
    redis:
      enabled: false
    clickhouse:
      enabled: false
    externalPostgres:
      host: postgres-rw.oneuptime.svc.cluster.local
      port: 5432
      username: oneuptime
      password:
      existingSecret:
        name: postgres-app
        passwordKey: password
      database: oneuptime
    aiAgent:
      enabled: false
    keda:
      enabled: false
