apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: fluent
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fluent-bit
    namespace: fluent
  values:
  #
  # 
    serviceAccount:
      create: true
      name: fluent-bit
    serviceMonitor:
      enabled: true
      selector:
        monitoring: portefaix
