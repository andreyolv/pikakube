apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: prometheus
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: prometheus-operator-crds
    namespace: prometheus
  # keep the chart's appVersion equal to kube-prometheus-stack's operator version
  values:
  # https://artifacthub.io/packages/helm/prometheus-community/prometheus-operator-crds
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-operator-crds/values.yaml
