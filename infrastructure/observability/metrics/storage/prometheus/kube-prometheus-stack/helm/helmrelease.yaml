apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: prometheus
  values:
  # https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  # k port-forward svc/kube-prometheus-stack-prometheus 9090
    # CRDs are installed first by crds/ so other releases can create ServiceMonitors before Prometheus
    crds:
      enabled: false
    grafana:
      enabled: false
    prometheusOperator:
      nodeSelector:
        agentpool: system
      tolerations:
      - effect: NoSchedule
        key: agentpool
        operator: Equal
        value: system
      admissionWebhooks:
        patch:
          nodeSelector:
            agentpool: system
          tolerations:
          - effect: NoSchedule
            key: agentpool
            operator: Equal
            value: system
    prometheus:
      prometheusSpec:
        nodeSelector:
          agentpool: system
        tolerations:
        - effect: NoSchedule
          key: agentpool
          operator: Equal
          value: system
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        retention: 2d
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
        thanos:
          image: quay.io/thanos/thanos:v0.38.0
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore
              key: objstore.yml
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true
      ingress:
        enabled: true
        annotations:
          forecastle.stakater.com/expose: "true"
          forecastle.stakater.com/icon: "https://raw.githubusercontent.com/cncf/artwork/refs/heads/main/projects/prometheus/icon/color/prometheus-icon-color.svg"
          forecastle.stakater.com/appName: "Prometheus"
          forecastle.stakater.com/group: "Observability"
        hosts:
        - prometheus.127.0.0.1.nip.io
        tls:
        - secretName: mkcert-tls-secret
          hosts:
          - prometheus.127.0.0.1.nip.io
    alertmanager:
      alertmanagerSpec:
        nodeSelector:
          agentpool: system
        tolerations:
        - effect: NoSchedule
          key: agentpool
          operator: Equal
          value: system
    kube-state-metrics:
      nodeSelector:
        agentpool: system
      tolerations:
      - effect: NoSchedule
        key: agentpool
        operator: Equal
        value: system
    # node-exporter is a DaemonSet: it must run on every node, taints included
    prometheus-node-exporter:
      tolerations:
      - operator: Exists