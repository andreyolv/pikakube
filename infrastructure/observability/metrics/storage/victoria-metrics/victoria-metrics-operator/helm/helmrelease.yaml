apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: victoria-metrics-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-operator
    namespace: victoria-metrics-operator
  values:
  # https://artifacthub.io/packages/helm/victoriametrics/victoria-metrics-operator
  # https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-operator/values.yaml
    rbac:
      pspEnabled: false
