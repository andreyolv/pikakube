apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: mlflow
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: mlflow
    namespace: mlflow
  values:
  # https://artifacthub.io/packages/helm/mlflow/mlflow
  # https://github.com/mlflow/mlflow/blob/master/charts/values.yaml
    deploymentStrategy:
      type: Recreate
    server:
      value_options:
        # MLflow 3 rejects any Host header it does not recognise — the default
        # list is localhost plus private IPs, which does not include the
        # cluster DNS name every in-cluster client uses
        allowed_hosts: "mlflow-mlflow*,localhost*,127.0.0.1*"
    mlflow:
      backendStoreUriFrom:
        secretKeyRef:
          name: mlflow-app
          key: connection
      defaultArtifactRoot: s3://mlflow/
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    env:
    - name: MLFLOW_S3_ENDPOINT_URL
      value: http://minio.mlflow.svc.cluster.local:9000
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootUser
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootPassword
    - name: AWS_DEFAULT_REGION
      value: us-east-1
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::00000000000:role/your-iam-role
