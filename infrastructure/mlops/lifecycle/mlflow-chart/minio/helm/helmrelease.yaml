apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: mlflow
spec:
  interval: 5m
  chart:
    spec:
      chart: minio
      version: 5.4.0
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
  values:
  # https://artifacthub.io/packages/helm/minio-official/minio
  # https://github.com/minio/minio/blob/master/helm/minio/values.yaml
    mode: standalone
    existingSecret: minio-credentials
    persistence:
      size: 2Gi
    buckets:
    - name: mlflow
      policy: none
      versioning: false
      objectlocking: false
