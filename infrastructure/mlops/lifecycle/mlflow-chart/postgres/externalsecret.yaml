apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-app
  namespace: mlflow
spec:
  refreshInterval: 168h
  target:
    name: mlflow-app
    # Owner, not Merge: external-secrets creates the Secret it owns, so there is
    # nothing to wait for and nothing to race with the CloudNativePG bootstrap
    creationPolicy: Owner
    template:
      # what CloudNativePG requires to consume a password — username + password
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mlflow
        password: "{{ .password }}"
        connection: "postgresql://mlflow:{{ .password }}@postgres-rw.mlflow.svc.cluster.local:5432/mlflow"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: pg-password-generator
