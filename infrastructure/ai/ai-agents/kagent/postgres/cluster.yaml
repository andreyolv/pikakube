apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: kagent
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  bootstrap:
    initdb:
      database: kagent
      owner: kagent
  resources:
    requests:
      cpu: 64m
      memory: "1Gi"
  storage:
    size: 8Gi
  monitoring:
    enablePodMonitor: true
  enablePDB: false
