apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: openbao
    namespace: openbao
  # the chart ignores server.nodeSelector/tolerations in dev mode, so they are patched in
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: StatefulSet
          name: openbao
        patch: |
          - op: add
            path: /spec/template/spec/nodeSelector
            value:
              agentpool: system
          - op: add
            path: /spec/template/spec/tolerations
            value:
            - effect: NoSchedule
              key: agentpool
              operator: Equal
              value: system
  values:
  # https://artifacthub.io/packages/helm/openbao/openbao
  # https://github.com/openbao/openbao-helm/blob/main/charts/openbao/values.yaml
    server:
      dev:
        enabled: true
      ingress:
        enabled: true
        annotations:
          forecastle.stakater.com/expose: "true"
          #forecastle.stakater.com/icon: "https://icon.icepanel.io/Technology/svg/HashiCorp-Vault.svg"
          forecastle.stakater.com/appName: "OpenBao"
          forecastle.stakater.com/group: "Security"
        hosts:
        - host: openbao.127.0.0.1.nip.io
          paths: 
          - /
        tls:
        - secretName: mkcert-tls-secret
          hosts:
          - openbao.127.0.0.1.nip.io
      # the openbao-init ConfigMap is created by init.sh (configmap-real.yaml, gitignored);
      # the volume is optional so the server still starts when it is missing
      postStart:
      - /bin/sh
      - -c
      - "[ ! -x /openbao/userconfig/init/openbao-init.sh ] || /openbao/userconfig/init/openbao-init.sh"
      volumes:
      - name: openbao-init
        configMap:
          name: openbao-init
          defaultMode: 0755
          optional: true
      volumeMounts:
      - name: openbao-init
        mountPath: /openbao/userconfig/init
    injector:
      enabled: false
    csi:
      enabled: false
    ui:
      enabled: true