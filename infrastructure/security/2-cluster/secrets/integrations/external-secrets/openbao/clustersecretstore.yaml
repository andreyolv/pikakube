apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    # OpenBao is API-compatible with Vault, so it uses the vault provider
    vault:
      server: http://openbao.openbao:8200
      path: pikakube
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-token
          key: token
          namespace: external-secrets