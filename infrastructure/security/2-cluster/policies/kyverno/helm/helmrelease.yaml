apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: kyverno
    namespace: kyverno
  values:
  # https://artifacthub.io/packages/helm/kyverno/kyverno
  # https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml
    global:
      nodeSelector:
        agentpool: system
      tolerations:
      - effect: NoSchedule
        key: agentpool
        operator: Equal
        value: system
    admissionController:
      replicas: 3
      nodeSelector:
        agentpool: system
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: admission-controller
      #resources:
      #  requests:
      #    cpu: 8m
      #    memory: 32Mi
      # ServiceMonitor CRD comes from kube-prometheus-stack, which is not deployed
      # (and depends on kyverno-manifests); enabling it before the CRD exists fails the install
      serviceMonitor:
        enabled: false
    backgroundController:
      replicas: 2
      nodeSelector:
        agentpool: system
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: background-controller
      resources:
        requests:
          cpu: 8m
          memory: 64Mi
      # ServiceMonitor CRD comes from kube-prometheus-stack, which is not deployed
      # (and depends on kyverno-manifests); enabling it before the CRD exists fails the install
      serviceMonitor:
        enabled: false
    cleanupController:
      replicas: 1
      nodeSelector:
        agentpool: system
      resources:
        requests:
          cpu: 8m
          memory: 32Mi
      # ServiceMonitor CRD comes from kube-prometheus-stack, which is not deployed
      # (and depends on kyverno-manifests); enabling it before the CRD exists fails the install
      serviceMonitor:
        enabled: false
    reportsController:
      replicas: 1
      nodeSelector:
        agentpool: system
      resources:
        requests:
          cpu: 16m
          memory: 128Mi
      # ServiceMonitor CRD comes from kube-prometheus-stack, which is not deployed
      # (and depends on kyverno-manifests); enabling it before the CRD exists fails the install
      serviceMonitor:
        enabled: false
    #grafana: 
    #  enabled: true
    #  grafanaDashboard:
    #    create: true
    features:
      backgroundScan:
        backgroundScanInterval: 24h
      policyExceptions:
        enabled: true
        namespace: '*'
