apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: container
  namespace: falco
spec:
  ociArtifact:
    image:
      repository: falcosecurity/plugins/plugin/container
      tag: 0.7.0
    registry:
      name: ghcr.io
---
# Enriches syscall events with Kubernetes metadata (k8s.ns.name, k8s.pod.name,
# k8s.deployment.name, labels, uid). It is the consumer for the metacollector in
# component.yaml — neither is useful without the other.
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: k8smeta
  namespace: falco
spec:
  ociArtifact:
    image:
      repository: falcosecurity/plugins/plugin/k8smeta
      tag: 0.4.1
    registry:
      name: ghcr.io
  config:
    initConfig:
      collectorPort: 45000
      collectorHostname: metacollector.falco.svc
      nodeName: "${FALCO_K8S_NODE_NAME}"

# https://github.com/falcosecurity/plugins/tree/main/plugins