# IRSA only. Skip this file when using EKS Pod Identity, which associates the role with
# (cluster, namespace, service account name) on the AWS side and needs nothing here.
#
# The operator creates this ServiceAccount itself, named after the Falco CR, and binds it
# to the RBAC the artifact-operator sidecar needs — so this object only adds the
# annotation. Do not point the Falco pod at a ServiceAccount of your own: it would lose
# that binding and the sidecar would stop reconciling Plugin/Rulesfile/Config objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8saudit-eks
  namespace: falco-k8saudit-eks
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/falco-dev
