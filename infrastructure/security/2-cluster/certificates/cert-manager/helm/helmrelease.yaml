apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      version: 1.16.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
  # https://artifacthub.io/packages/helm/cert-manager/cert-manager
  # https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
    crds:
      enabled: true
    nodeSelector:
      agentpool: system
    tolerations:
    - effect: NoSchedule
      key: agentpool
      operator: Equal
      value: system
    webhook:
      nodeSelector:
        agentpool: system
      tolerations:
      - effect: NoSchedule
        key: agentpool
        operator: Equal
        value: system
    cainjector:
      nodeSelector:
        agentpool: system
      tolerations:
      - effect: NoSchedule
        key: agentpool
        operator: Equal
        value: system
    startupapicheck:
      nodeSelector:
        agentpool: system
      tolerations:
      - effect: NoSchedule
        key: agentpool
        operator: Equal
        value: system
