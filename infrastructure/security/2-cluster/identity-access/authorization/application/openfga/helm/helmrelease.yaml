apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openfga
  namespace: openfga
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: openfga
    namespace: openfga
  values:
  # https://artifacthub.io/packages/helm/openfga/openfga
  # https://github.com/openfga/helm-charts/blob/main/charts/openfga/values.yaml
    replicaCount: 1
    telemetry:
      metrics:
        serviceMonitor:
          enabled: true
    datastore:
      engine: postgres
      uri: postgres://postgres:password@openfga-postgresql.openfga.svc.cluster.local:5432/postgres?sslmode=disable
    postgresql:
      enabled: true
      auth:
        postgresPassword: password
        database: postgres
