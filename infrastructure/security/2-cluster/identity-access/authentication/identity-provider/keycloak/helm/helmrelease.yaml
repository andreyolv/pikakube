apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: keycloak
  values:
  # https://artifacthub.io/packages/helm/codecentric/keycloakx
  # https://github.com/codecentric/helm-charts/blob/master/charts/keycloakx/values.yaml
    command:
      - "/opt/keycloak/bin/kc.sh"
      - "--verbose"
      - "start"
      - "--http-port=8080"
      - "--hostname-strict=false"
      - "--spi-events-listener-jboss-logging-success-level=info"
      - "--spi-events-listener-jboss-logging-error-level=warn"
    extraEnv: |
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: {{ include "keycloak.fullname" . }}-admin-creds
            key: user
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ include "keycloak.fullname" . }}-admin-creds
            key: password
      - name: JAVA_OPTS_APPEND
        value: >-
          -XX:MaxRAMPercentage=50.0
          -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
      - name: KC_DB_URL_HOST
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: host
      - name: KC_DB_URL_PORT
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: port
      - name: KC_DB_URL_DATABASE
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: dbname
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: username
    dbchecker:
      #enabled: true
    database:
      vendor: postgres
      existingSecret: postgres-app
      existingSecretKey: password
    secrets:
      admin-creds:
        annotations:
          my-test-annotation: Test secret for {{ include "keycloak.fullname" . }}
        stringData:
          user: admin
          password: secret
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: true
