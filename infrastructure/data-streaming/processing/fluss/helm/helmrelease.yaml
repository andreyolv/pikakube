apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluss
  namespace: fluss
spec:
  interval: 5m
  chart:
    spec:
      chart: fluss
      version: 0.9.0-incubating
      sourceRef:
        kind: HelmRepository
        name: fluss
        namespace: flux-system
  values:
  # https://github.com/apache/fluss/blob/main/helm/values.yaml
    configurationOverrides:
      # the chart default assumes the ZooKeeper release is named "zk";
      # ours is named "zookeeper", so the service is zookeeper.<ns>.svc
      zookeeper.address: zookeeper.fluss.svc.cluster.local:2181
