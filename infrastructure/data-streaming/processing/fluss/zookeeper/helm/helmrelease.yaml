apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zookeeper
  namespace: fluss
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fluss-zookeeper
    namespace: fluss
  values:
  # https://artifacthub.io/packages/helm/bitnami/zookeeper
  # https://github.com/bitnami/charts/blob/main/bitnami/zookeeper/values.yaml
    # Bitnami moved the free image catalog to docker.io/bitnamilegacy
    # https://github.com/bitnami/containers/issues/83267
    global:
      security:
        allowInsecureImages: true
    image:
      repository: bitnamilegacy/zookeeper
    volumePermissions:
      image:
        repository: bitnamilegacy/os-shell
