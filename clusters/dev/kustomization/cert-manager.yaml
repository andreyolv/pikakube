apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
  - name: prometheus-crds
  interval: 5m
  path: ./infrastructure/security/2-cluster/certificates/cert-manager
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system