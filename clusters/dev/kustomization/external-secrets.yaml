apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  dependsOn:
  - name: openbao
  interval: 5m
  # wait for the HelmRelease to be Ready so dependsOn means the CRDs/pods exist
  wait: true
  timeout: 10m
  path: ./infrastructure/security/2-cluster/secrets/integrations/external-secrets
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-manifests
  namespace: flux-system
spec:
  dependsOn:
  - name: external-secrets
  interval: 1m
  path: ./infrastructure/security/2-cluster/secrets/integrations/external-secrets/openbao
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system